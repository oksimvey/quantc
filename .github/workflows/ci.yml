name: QuantC CI

on:
  push:
    branches: [main, feature/split-codegen-dynamic-auto]
  pull_request:
    branches: [main]

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure with Clang
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++

      - name: Build QuantC
        run: cmake --build build --config Release

      - name: Transpile dynamic auto test
        run: ./build/QuantC tests/dynamic/main.qc -o build/generated

      - name: Verify split output
        run: |
          test -f build/generated/main.cpp
          test -f build/generated/Dog.h
          grep -q 'std::variant<std::string, Dog> dog' build/generated/main.cpp
          grep -q '#include "Dog.h"' build/generated/main.cpp

      - name: Compile generated C++ with Clang
        run: clang++ -std=c++23 build/generated/main.cpp -Ibuild/generated -o build/generated/app

      - name: Run generated program
        run: |
          output="$(./build/generated/app)"
          test "$output" = "Woof"
